name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'master' 
    paths:
      - '**.hpp'
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '**CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - 'master'
    paths:
      - '**.hpp'
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '**CMakeLists.txt'
      - '.github/workflows/build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        build-type: [Release]
        include:
          - os: windows-latest
            arch: x86
            cmake-args: '-AWin32 -Thost=x86 -DGH_ACBUILD=TRUE -DUSING_BOOST_NO_CONAN=TRUE -DUSING_OPENSSL_NO_CONAN=TRUE -DBoost_NO_BOOST_CMAKE=ON'
          - os: ubuntu-22.04
            arch: i386
            cmake-args: '-DGH_ACBUILD=TRUE -DUSING_BOOST_NO_CONAN=TRUE -DUSING_OPENSSL_NO_CONAN=TRUE -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      BUILD_TYPE: ${{ matrix.build-type }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: get-cmake
      # Pin <4.0: CMake 4 menghapus FindBoost dan menolak cmake_minimum_required <3.5
      # yang masih dipakai libs/cmake-conan.
      uses: lukka/get-cmake@v3.31.6

    - if: runner.os == 'Windows'
      name: Install boost (32-bit)
      run: |
          $Url = "https://archives.boost.io/release/1.83.0/binaries/boost_1_83_0-msvc-14.3-32.exe"
          (New-Object System.Net.WebClient).DownloadFile($Url, "$env:TEMP\boost32.exe")
          Start-Process -Wait -FilePath "$env:TEMP\boost32.exe" "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\hostedtoolcache\windows\Boost32"

    - if: runner.os == 'Windows'
      name: Set boost env
      run: |
          echo "BOOST_ROOT=C:/hostedtoolcache/windows/Boost32" >> $env:GITHUB_ENV
          echo "BOOST_LIBRARYDIR=C:/hostedtoolcache/windows/Boost32/lib32-msvc-14.3" >> $env:GITHUB_ENV

    - if: runner.os == 'Windows'
      name: Install openssl
      run: choco install openssl --forcex86 -y | out-null
      
    - if: runner.os == 'Windows'
      name: Setup openssl envvar
      run: |
          echo "OPENSSL_ROOT_DIR=C:/Program Files (x86)/OpenSSL-Win32" >> $env:GITHUB_ENV
          echo "OPENSSL_ROOT=C:/Program Files (x86)/OpenSSL-Win32" >> $env:GITHUB_ENV
      
    - if: runner.os == 'Linux'
      name: Install gcc/g++-multilib + 32-bit deps
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib libboost-dev:i386 libssl-dev:i386

    - name: Get python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install conan
      run: |
        python -m pip install --upgrade pip
        pip install "conan<2"

    - if: runner.os == 'Linux'
      name: Set linux 32-bit env
      run: |
        echo "BOOST_ROOT=/usr" >> $GITHUB_ENV
        echo "OPENSSL_ROOT_DIR=/usr" >> $GITHUB_ENV

    - name: Generate build files (Windows)
      if: runner.os == 'Windows'
      run: cmake -S . -B build ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

    - name: Generate build files (Linux)
      if: runner.os == 'Linux'
      run: cmake -S . -B build ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}CC_VERSION="${{ env.REPO_TAG }}" -DBOOST_ROOT=${{ env.BOOST_ROOT }} -DOPENSSL_ROOT=${{ env.OPENSSL_ROOT }}

    - if: runner.os == 'Windows'
      name: Build Windows
      run: cmake --build build --config ${{ matrix.build-type }}

    - if: runner.os == 'Linux'
      name: Build Linux
      run: cmake --build build --parallel 2
      

    - if: runner.os == 'Windows'
      name: Verify 32-bit PE (Windows)
      run: |
          $p = Get-ChildItem -Recurse -Filter discord-connector.dll build | Select-Object -First 1
          if (-not $p) { throw 'discord-connector.dll not found' }
          $bytes = [System.IO.File]::ReadAllBytes($p.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          "file: $($p.FullName)"
          "Machine=0x{0:X4}" -f $machine
          if ($machine -ne 0x014C) { throw ("NOT i386: machine=0x{0:X4}" -f $machine) }
          "OK: i386 (32-bit)"
      shell: pwsh

    - if: runner.os == 'Linux'
      name: Verify 32-bit ELF (Linux)
      run: |
          f=$(find build -name discord-connector.so | head -1)
          echo "file: $f"
          file "$f"
          readelf -h "$f" | grep -q 'ELF32' || (echo 'NOT ELF32' && exit 1)
          echo 'OK: ELF32 (i386)'

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: discord-connector-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.build-type }}
        path: |
          build/artifact/**
          build/**/discord-connector.dll
          build/**/discord-connector.so
          build/**/log-core2.dll
          build/**/log-core2.so
        if-no-files-found: warn